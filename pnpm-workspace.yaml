packages:
  - packages/*
  - fixtures
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.69.0'
  - '@typescript-eslint/parser@8.69.0'
  - '@typescript-eslint/project-service@8.69.0'
  - '@typescript-eslint/scope-manager@8.69.0'
  - '@typescript-eslint/tsconfig-utils@8.69.0'
  - '@typescript-eslint/type-utils@8.69.0'
  - '@typescript-eslint/types@8.69.0'
  - '@typescript-eslint/typescript-estree@8.69.0'
  - '@typescript-eslint/utils@8.69.0'
  - '@typescript-eslint/visitor-keys@8.69.0'
  - typescript-eslint@8.69.0

# esbuild links its platform binary from a postinstall script; drizzle-kit
# cannot load a config file without it. The rest are optional native speedups
# for the Testcontainers SSH path that the pure-JS fallbacks already cover.
allowBuilds:
  # Unpacks the stock PostgreSQL binaries the no-container test path runs. Only
  # the current platform's package installs, and none of them ship: this is the
  # third rung of the test-database ladder, never a runtime dependency.
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
