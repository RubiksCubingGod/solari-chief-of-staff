# The quality gate from ARCHITECTURE §9.3. It runs `pnpm check` - the same
# command a developer runs - so CI cannot drift into checking something else.
name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Before setup-node, so its pnpm store cache has a pnpm to ask. The
      # version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Integration tests take the Testcontainers path here: the runner has a
      # Docker daemon, so no TEST_DATABASE_URL is set and each suite gets its
      # own throwaway postgres:17-alpine.
      - run: pnpm check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
