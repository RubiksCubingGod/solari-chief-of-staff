# The nightly live smoke against the real Solari gateway.
#
# Deliberately not on `push` or `pull_request`. Every push would spend vendor
# credit and burn concurrency slots, and a pull request from a fork cannot read
# the secret anyway - it would report a green run that never called anything.
name: live-smoke

on:
  schedule:
    # 07:17 UTC. Off the hour, because every scheduled workflow on GitHub that
    # asks for :00 is queued behind every other one that did.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two live runs at once: the plan has a concurrency limit, and
  # ConcurrencyLimitExceeded is not retryable. A queued run waits instead of
  # being cancelled, so a manual dispatch cannot silently discard the nightly.
  group: live-smoke
  cancel-in-progress: false

jobs:
  # The secret cannot be read from a job-level `if`, so the check is a job of
  # its own. Its output is what lets the smoke job report *skipped* rather than
  # green when the key is missing - a green run that called nothing is the one
  # outcome this workflow must never produce.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.key.outputs.configured }}
    steps:
      - id: key
        env:
          SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
        run: |
          if [ -n "$SOLARI_API_KEY" ]; then
            printf 'configured=true\n' >>"$GITHUB_OUTPUT"
          else
            printf 'configured=false\n' >>"$GITHUB_OUTPUT"
            printf '::warning::SOLARI_API_KEY is not configured; the live smoke was skipped, not passed.\n'
          fi

  live-smoke:
    needs: guard
    if: ${{ needs.guard.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No `pnpm browsers` step: the browser is Solari's, reached over its
      # websocket endpoint. Playwright's driver ships in node_modules, and
      # nothing here launches a local Chromium.
      - run: node scripts/live-smoke.mjs
