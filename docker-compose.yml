# Local development Postgres.
#
# Integration tests do not use this service: each test gets its own throwaway
# database (packages/db/src/testing/postgres.ts). This is the database you point
# the API and worker at while developing.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chief_of_staff
      POSTGRES_PASSWORD: chief_of_staff
      POSTGRES_DB: chief_of_staff
    # Parameterised so a workstation already running Postgres on 5432 can move
    # this one aside instead of failing to start.
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chief_of_staff -d chief_of_staff']
      interval: 5s
      timeout: 5s
      retries: 20

  # The fixture sites, for poking at by hand. Integration tests do not use this
  # service either: each test file boots its own private in-process instances on
  # ephemeral ports. This runs the same `start*Fixture()` factories through the
  # same registry, so there is one boot path and several entry points.
  fixtures:
    image: node:22-alpine
    working_dir: /repo
    # Bind the wildcard interface *inside* the container so the published ports
    # are reachable at all; the tests keep their loopback default.
    environment:
      FIXTURES_HOST: 0.0.0.0
    command: ['sh', '-c', 'corepack enable && pnpm install --frozen-lockfile && pnpm fixtures:dev']
    # Published on loopback deliberately. `/__test/*` is an unauthenticated,
    # mutable control plane, and the harness contract's reason it needs no
    # authentication is that an instance is only ever reachable over loopback.
    # A bare `4301:4301` would publish it on every host interface and take that
    # reason away.
    ports:
      - '127.0.0.1:${FAKESTORE_PORT:-4301}:4301'
      - '127.0.0.1:${FAKENEWS_PORT:-4302}:4302'
      - '127.0.0.1:${FAKEGYM_PORT:-4303}:4303'
      - '127.0.0.1:${FAKEDMV_PORT:-4304}:4304'
    volumes:
      - .:/repo

volumes:
  postgres-data:
